# 最簡單的做法:雙擊 start.bat(Windows)或 start.command(macOS),在瀏覽器裡一步步填,不用改這個檔。
# 想手動改:複製成 niche.yaml 再改。playlist_id 和 facts 的 source 不給 LLM,其餘欄位會寫進選題或腳本的指示。
channel_name: "我的頻道"
# 頻道主題:一句話講這個頻道在做什麼,選題和寫腳本都會參考
theme: "幫新手避開常見的坑"
audience: "剛開始接觸這個領域、怕被坑的新手"
tone: "像朋友聊天,白話,不賣弄術語"
minutes: 8
# --upload 時要把片加進哪個播放清單;留空字串就不加。清單 ID 到 YouTube Studio 的播放清單頁網址裡找。
playlist_id: ""
seed_topics:
  - "新手最常犯的錯"
  - "某個常見說法到底對不對"
  - "入門要先搞懂的事"
# 腳本裡允許出現的數字。每筆要寫屬於誰(subject);閘門會檢查「數字和主體在同一句」。
# 沒列在這裡的阿拉伯數字 → 整支片擋下。
facts:
  - subject: "範例主體"
    value: "12.5%"
    source: "https://example.com/請填資料來源"
